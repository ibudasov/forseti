services:
  postgresql:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-forseti}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: forseti-app
    build: &app-build
      context: .
      args:
        INSTALL_DEV: "true"
        PIP_TRUSTED_HOSTS: ${PIP_TRUSTED_HOSTS:-}
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      # sourced from Codespaces/host secrets, not committed to .env
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
      - PORT=${PORT:-8000}
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ${HOME}/.config/gcloud/application_default_credentials.json:/home/forseti/.config/gcloud/application_default_credentials.json:ro

  infra-tools:
    image: forseti-app
    build: *app-build
    profiles: ["tools"]
    volumes:
      - ./scripts:/app/scripts:ro
      - ./tests:/app/tests:ro
      - ./infra:/app/infra:ro
      - ./docs:/app/docs

  terraform:
    image: hashicorp/terraform:1.17.1
    profiles: ["tools"]
    working_dir: /workspace/infra/terraform
    volumes:
      - .:/workspace

  cloudsql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.15.2
    profiles: ["tools"]
    network_mode: host
    volumes:
      - ${HOME}/.config/gcloud/application_default_credentials.json:/adc.json:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /adc.json

  cloud-psql:
    image: pgvector/pgvector:pg15
    profiles: ["tools"]
    network_mode: host

  actionlint:
    image: rhysd/actionlint:1.7.12
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - .:/workspace:ro

  tflint:
    image: ghcr.io/terraform-linters/tflint:v0.65.0
    profiles: ["tools"]
    working_dir: /workspace/infra/terraform
    volumes:
      - .:/workspace

volumes:
  db_data:
