services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trading_analyst
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn trading_analyst.main:app --host 0.0.0.0 --port 8000"
    environment:
      TRADING_ANALYST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/trading_analyst
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
