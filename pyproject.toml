[project]
name = "forseti"
version = "0.1.0"
description = "A FastAPI project scaffold using pedantic for request validation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Forseti User" }
]
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.23.0",
  "pedantic>=1.8.0",
  "sqlmodel>=0.0.8",
  "alembic>=1.11.0",
  "python-dotenv>=1.0.0",
  "pydantic-settings>=2.0.0",
  "psycopg2-binary>=2.9.0",
  "google-adk>=1.0.0,<3.0.0"
]

[project.optional-dependencies]
test = [
  "pytest>=7.0.0",
  "httpx>=0.24.0",
  "testcontainers[community]>=4.0.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"