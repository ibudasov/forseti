name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
      - 'docs/**/*.md'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-wiki
  cancel-in-progress: false

jobs:
  sync:
    name: Sync wiki/ and docs/ to GitHub Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Sync wiki and docs directories to GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          askpass="$(mktemp)"
          wiki_dir="$(mktemp -d)"
          trap 'rm -rf "$askpass" "$wiki_dir"' EXIT

          cat > "$askpass" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) echo "x-access-token" ;;
            *Password*) echo "$GH_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"

          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0

          wiki_url="https://github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git clone "$wiki_url" "$wiki_dir"; then
            echo "::error::Failed to clone ${wiki_url}. Ensure GitHub Wiki is enabled in repository Settings and initialized with at least one page."
            exit 1
          fi

          # Handle a freshly initialized wiki repository with no commits yet.
          if ! git -C "$wiki_dir" rev-parse --verify HEAD >/dev/null 2>&1; then
            git -C "$wiki_dir" checkout -b master
          fi

          rsync -a --delete --exclude='.git' --exclude='/docs' wiki/ "$wiki_dir/"
          mkdir -p "$wiki_dir/docs"
          rsync -a --delete --prune-empty-dirs --include='*/' --include='*.md' --exclude='*' docs/ "$wiki_dir/docs/"

          git -C "$wiki_dir" add -A
          if git -C "$wiki_dir" diff --cached --quiet; then
            echo "GitHub Wiki is already up to date."
            exit 0
          fi

          git -C "$wiki_dir" config user.name "github-actions[bot]"
          git -C "$wiki_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$wiki_dir" commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git -C "$wiki_dir" push origin HEAD
