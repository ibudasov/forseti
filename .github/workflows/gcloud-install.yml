name: GCloud install validation

on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - "Makefile"
      - ".github/workflows/gcloud-install.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install make
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y make

      - name: Install Google Cloud CLI
        run: bash .devcontainer/install-gcloud.sh

      - name: Verify Google Cloud CLI
        run: gcloud --version

      - name: Verify logout without credentials
        run: make cloud-logout
