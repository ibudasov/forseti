name: Enable auto-merge for green PRs

on:
  workflow_run:
    workflows: ["Build-n-test"]
    types: [completed]

permissions:
  checks: read
  contents: read
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for eligible pull requests
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.PULL_REQUEST_WRITE_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PULL_REQUESTS: ${{ toJson(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail

          if [ "$PULL_REQUESTS" = "[]" ]; then
            echo "No pull requests are associated with this workflow run."
            exit 0
          fi

          echo "$PULL_REQUESTS" | jq -c '.[]' | while read -r pull_request; do
            pull_request_number=$(echo "$pull_request" | jq -r '.number')
            pull_request_view=$(gh pr view "$pull_request_number" --json state,isDraft,autoMergeRequest,headRefOid)

            pull_request_state=$(echo "$pull_request_view" | jq -r '.state')
            pull_request_is_draft=$(echo "$pull_request_view" | jq -r '.isDraft')
            pull_request_auto_merge_enabled=$(echo "$pull_request_view" | jq -r '.autoMergeRequest != null')
            pull_request_head_sha=$(echo "$pull_request_view" | jq -r '.headRefOid')

            if [ "$pull_request_state" != "OPEN" ]; then
              echo "Skipping PR #$pull_request_number because it is not open."
              continue
            fi

            if [ "$pull_request_is_draft" = "true" ]; then
              echo "Skipping PR #$pull_request_number because it is still a draft."
              continue
            fi

            if [ "$pull_request_auto_merge_enabled" = "true" ]; then
              echo "Skipping PR #$pull_request_number because auto-merge is already enabled."
              continue
            fi

            if [ "$pull_request_head_sha" != "$HEAD_SHA" ]; then
              echo "Skipping PR #$pull_request_number because its head SHA changed after Build-n-test ran."
              continue
            fi

            set +e
            required_checks=$(gh pr checks "$pull_request_number" --required --json name,state,bucket,link 2>&1)
            required_checks_exit_code=$?
            set -e

            if [ "$required_checks_exit_code" -ne 0 ] && [ "$required_checks_exit_code" -ne 8 ]; then
              echo "Failed to read required checks for PR #$pull_request_number."
              echo "$required_checks"
              exit "$required_checks_exit_code"
            fi

            if [ "$required_checks" = "[]" ]; then
              echo "Skipping PR #$pull_request_number because it has no required checks."
              continue
            fi

            failing_or_pending_checks=$(echo "$required_checks" | jq -r '.[] | select(.bucket != "pass") | "\(.name): \(.state)"')

            if [ -n "$failing_or_pending_checks" ]; then
              echo "Skipping PR #$pull_request_number because not all required checks are passing:"
              echo "$failing_or_pending_checks"
              continue
            fi

            echo "Enabling squash auto-merge for PR #$pull_request_number."
            gh pr merge "$pull_request_number" --auto --squash --match-head-commit "$HEAD_SHA"
          done
