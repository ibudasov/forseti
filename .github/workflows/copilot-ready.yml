name: Mark completed Copilot PR ready

# Uses pull_request_target because the default GITHUB_TOKEN on a fork-based
# pull_request event cannot update pull request metadata. To stay safe with the
# elevated permissions this grants, the workflow never checks out, builds or
# executes any code from the pull request: it only reads trusted event metadata
# and flips the draft flag.
on:
  pull_request_target:
    types: [review_requested]

permissions:
  contents: read
  pull-requests: write

jobs:
  mark-ready:
    # The Copilot coding agent app has been surfaced under both logins, so both
    # are accepted; the Bot type check keeps human accounts out.
    if: >
      github.event.pull_request.draft == true &&
      github.event.pull_request.user.type == 'Bot' &&
      (github.event.pull_request.user.login == 'copilot-swe-agent[bot]' ||
      github.event.pull_request.user.login == 'Copilot')
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR ready for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh pr ready ${{ github.event.pull_request.number }}
