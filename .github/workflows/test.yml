name: Build-n-test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    environment: pipeline
    env:
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
    
    strategy:
      matrix:
        python-version: ['3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Ensure Docker Compose is available
        run: |
          docker --version
          docker compose version

      - name: Typecheck
        run: make typecheck

      - name: Run tests
        env:
          DOCKER_COMPOSE: docker compose
        run: |
          make test

      - name: Scorecard
        env:
          DOCKER_COMPOSE: docker compose
        run: |
          set +e
          make scorecard > scorecard.log 2>&1
          exit_code=$?
          set -e
          cat scorecard.log
          python3 - <<'PYEOF'
lines = open("scorecard.log").read().splitlines()
table_lines = [line for line in lines if line.startswith("|")]
markdown = "## Scorecard\n\n" + "\n".join(table_lines) + "\n" if table_lines else "## Scorecard\n\n_No scorecard output was produced; see the job log._\n"
with open("scorecard.md", "w") as f:
    f.write(markdown)
PYEOF
          exit $exit_code

      - name: Append scorecard to job summary
        if: always()
        run: |
          if [ -f scorecard.md ]; then
            cat scorecard.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post scorecard as a sticky PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = "scorecard.md";
            if (!fs.existsSync(path)) {
              return;
            }
            const marker = "<!-- scorecard-comment -->";
            const body = `${marker}\n${fs.readFileSync(path, "utf8")}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.data.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

