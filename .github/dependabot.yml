version: 2
multi-ecosystem-groups:
  monthly-dependencies:
    schedule:
      interval: monthly
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: monthly-dependencies
    ignore:
      - dependency-name: google-genai
        update-types: ["version-update:semver-major"]
      # google-cloud-bigquery enforces python-dateutil<3.0.0; blocks upgrade to 4.x
      # until googleapis/google-cloud-python#18948 is resolved upstream.
      - dependency-name: "python-dateutil"
        update-types: ["version-update:semver-major"]
      # google-adk enforces websockets<16,>=15.0.1; blocks upgrade to 16+/17.x
      # until google-adk supports >=16.
      - dependency-name: "websockets"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: monthly-dependencies
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    patterns: ["*"]
    multi-ecosystem-group: monthly-dependencies
